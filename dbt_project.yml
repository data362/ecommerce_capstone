name: 'ecommerce_capstone'
version: '1.0.0'
config-version: 2

# dbt Cloud ignores this, but keep it tidy
profile: 'ecommerce_capstone'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Global config
models:
  +schema: "{{ target.schema }}__{{ target.name | lower }}"

  ecommerce_capstone:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  +database: ae-capstone-demo
  +schema: dbt_data362_raw 
